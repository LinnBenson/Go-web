plugins { id 'com.android.application' }
android {
    namespace 'io.todu.goweb'
    compileSdkVersion 'android-37.2'
    defaultConfig { applicationId 'io.todu.goweb'; minSdk 26; targetSdk 35; versionCode 62; versionName '1.1.2' }
    splits { abi { enable true; reset(); include 'armeabi-v7a', 'arm64-v8a'; universalApk false } }
    // Store complete native libraries compressed; Android extracts them at install time.
    // Loading then uses normal native files, without decompressing on each launch.
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.wear.watchface:watchface-complications-data-source:1.2.1'
 implementation 'org.mozilla.geckoview:geckoview:160.0.20261104181552' }
